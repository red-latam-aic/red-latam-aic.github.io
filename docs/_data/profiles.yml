livs:
  name: "Luis Itza Vazquez Salazar"
  image: "/assets/images/livs.jpeg"
  linkedin: "https://www.linkedin.com/in/luis-itza-vazquez-salazar/"
  website: "https://livazquezs.github.io/"
  email: "li.vazquez-salazar@alumni.uni-heidelberg.de"

  bio:
    es: |
      Soy originario de Ciudad de Mexico. Estudie la licenciatura en quimica en la Facultad de Quimica de la Universidad Nacional Autonoma de Mexico.
       Posteriormente continue con mis estudios de maestria en quimica teorica y modelado computacional en la Universidad de Groningen 
       en los Paises Bajos gracias a una beca ERASMUS+ por parte de la Union Europea. Al termino de este periodo continue con mis estudios de
       doctorado en fisicoquimica en la Universidad de Basel en Suiza. Posteriormente recibi una beca de la Swiss National Science Foundation 
       para realizar una estancia postdoctoral en el Instituto de Fisica Teorica de la Universidad de Heidelberg, Alemania. En el otono de 2026,
       espero iniciar mi grupo de investigacion como profesor asistente.
    en: |
      I am originally from Mexico City. I studied chemistry at the Faculty of Chemistry at the National Autonomous University of Mexico. 
      Later I completed a master's degree in theoretical chemistry and computational modeling at the University of Groningen in the Netherlands 
      with support of an ERASMUS+ scholarship from the European Union. After obtaining my degree,
      I continued with a PhD in physical chemistry at the University of Basel in Switzerland. 
      At the end of my PhD, I received a Swiss National Science Foundation fellowship 
      for a postdoctoral stay at the Institute for Theoretical Physics at Heidelberg University in Germany. 
      In autumn 2026, I expect to start my research group as an assistant professor.
    pt: |
      Sou da Cidade do Mexico. Fiz a graduacao em quimica na Faculdade de Quimica da Universidade Nacional Autonoma do Mexico.
      Em seguida fiz um mestrado em quimica teorica e modelagem computacional na Universidade de Groningen, nos Paises Baixos, 
      com apoio de uma bolsa ERASMUS+ da Uniao Europeia. Depois disso fiz o doutorado em fisicoquimica na Universidade de Basel, na Suica. 
      Posteriormente recebi uma bolsa da Swiss National Science Foundation para um pos doutorado no 
      Instituto de Fisica Teorica da Universidade de Heidelberg, na Alemanha. 
      No outono de 2026, espero iniciar meu grupo de pesquisa como professor assistente.

  interests:
    es:
      - "Diseno inverso de materiales con metodos de inteligencia artificial"
      - "Cuantificacion de la incertidumbre en aprendizaje automatico"
      - "Modelacion multiescala en quimica"
      - "Exploracion del espacio quimico"
    en:
      - "Inverse design of materials with artificial intelligence methods"
      - "Uncertainty quantification in machine learning"
      - "Multiscale modeling in chemistry"
      - "Exploration of chemical space"
    pt:
      - "Design inverso de materiais com metodos de inteligencia artificial"
      - "Quantificacao de incerteza em aprendizado de maquina"
      - "Modelagem multiescala em quimica"
      - "Exploracao do espaco quimico"

ms:
  name: "Manuel Szewc"
  image: "/assets/images/ms.jpg"
  website: "https://www.linkedin.com/in/manuel-szewc-55a2a6177/"
  email: "mszewc@unsam.edu.ar"

  bio:
    es: |
      Soy un físico argentino y actualmente me desempeño como investigador en CONICET, con lugar de trabajo en el 
      Instituto de Ciencias Físicas (ICIFI), Escuela de Ciencia y Tecnología, Universidad de San Martín. 
      Soy físico de altas energías, y estudio la fenomenología de las partículas fundamentales utilizando herramientas 
      de estadística, incluyendo el desarrollo de técnicas de aprendizaje automático. 
      Hice la licenciatura en Ciencias Físicas en la Universidad de Buenos Aires y mi doctorado en la UNSAM. 
      Realice dos estancias postdoctorales, en el Instituto Jozef Stefan, Eslovenia y en la Universidad de Cincinnati, Estados Unidos.     
    en: |
      I am an Argentine physicist who currently works as a researcher at CONICET, based at the 
      Institute of Physical Sciences (ICIFI), School of Science and Technology, University of San Martín. 
      I am a high-energy physicist, and I study the phenomenology of fundamental particles using statistical tools, including the development of machine learning techniques. 
      I did my undergraduate studies in Physical Sciences at the University of Buenos Aires and my PhD at UNSAM. 
      I have also worked at the Jozef Stefan Institute, Slovenia and at the University of Cincinnati, United States.
    pt: |
      Sou um fisico argentino e atualmente trabalho como pesquisador no CONICET, com sede no 
      Instituto de Ciencias Físicas (ICIFI), Escola de Ciencia e Tecnologia, Universidade de San Martín. 
      Sou um fisico de altas energias, e estudo a fenomenologia das particulas fundamentais usando ferramentas 
      de estatistica, incluindo o desenvolvimento de tecnicas de aprendizado de maquina. 
      Fiz minha licenciatura em Ciencias Fisicas na Universidade de Buenos Aires e meu doutorado na UNSAM. 
      Realizei duas estancias posdoutorais, no Instituto Jozef Stefan, Eslovenia e na Universidade de Cincinnati, Estados Unidos.


  interests:
    es:
      - "Inferencia estadistica en fisica de altas energias"
      - "Mejora de simuladores a partir de mediciones y herramientas de aprendizaje automatico"
      - "Soluciones a problemas inversos con reglas fisicas"
      - "Cuantificacion de la incertidumbre en aprendizaje automatico"
    en:
      - "Statistical inference in high-energy physics"
      - "Improvement of simulators from measurements and machine learning tools"
      - "Solutions to inverse problems with physical rules"
      - "Uncertainty quantification in machine learning"
    pt:
      - "Inferencia estatistica na fisica de altas energias"
      - "Melhoria de simuladores a partir de medidas e ferramentas de aprendizado de maquina"
      - "Solucoes para problemas inversos com regras fisicas"
      - "Quantificacao de incerteza em aprendizado de maquina" 
